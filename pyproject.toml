[project]
name = "interest-signals"
version = "0.1.0"
description = "Agent Skill: attention signals for topics across Wikipedia language editions."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
    "pandas>=2.2",
    "numpy>=2.1",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "jinja2>=3.1",
    "platformdirs>=4.3",
    "tzdata>=2024.1",  # needed by pandas on Windows; listed so the Linux-generated lock covers it
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pip-tools>=7.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: calls real Wikimedia APIs (deselected by default)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP007", "B905"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["UP"]
