name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.14"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (hash-pinned runtime + dev tools)
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip install pytest ruff pip-tools
      - name: Lock file is current
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: |
          cp requirements.lock /tmp/committed.lock
          sh dev/lock.sh
          diff /tmp/committed.lock requirements.lock
      - name: Lint
        run: ruff check src tests scripts dev eval
      - name: Tests (unit, synthetic, replay)
        run: python -m pytest
      - name: Bootstrap from a clean copy
        if: runner.os == 'Linux'
        run: |
          cp -r . /tmp/skill && rm -rf /tmp/skill/.venv
          python /tmp/skill/scripts/analyze.py --version
